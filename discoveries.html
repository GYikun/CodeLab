<main>

<!-- DISCOVERIES -->
<section class="discoveries-section">
  <div class="wrap">
    <!-- Filled from data/discoveries.json -->

    <!-- Filled from data/video.json; stays hidden while no video is set -->

  </div>
</section>

  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/data.js"></script>
<script>
/* Shown when a paper has no image. */
var DEFAULT_ICON = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>';

CodeLabData.load(['discoveries', 'video']).then(function (data) {
  var D = CodeLabData, dict = { en: {}, nl: {} };
  var grid = document.getElementById('discoveryGrid');
  var videoBox = document.getElementById('discoveryVideo');

  /* Video if set; otherwise the cover image alone as a placeholder; otherwise hidden. */
  var v = data.video || {};
  if (v.src) {
    videoBox.innerHTML = '<video controls playsinline preload="metadata"' +
      (v.poster ? ' poster="' + D.esc(v.poster) + '"' : '') + '>' +
      '<source src="' + D.esc(v.src) + '">' +
    '</video>';
    videoBox.hidden = false;
  } else if (v.poster) {
    videoBox.innerHTML = '<img src="' + D.esc(v.poster) + '" alt="">';
    videoBox.hidden = false;
  }

  if (!data.discoveries) {
    D.showError(grid);
  } else {
    /* Newest year first; papers from the same year keep their file order. */
    var papers = D.sortByTime(data.discoveries, function (p) { return String(p.year); }, 'desc');
    grid.innerHTML = papers.map(function (p, i) {
      var key = 'paper' + i;
      var media = p.image
        ? '<div class="discovery-media"><img src="' + D.esc(p.image) + '" alt="' + D.esc(D.text(p.title, 'en')) + '" loading="lazy"></div>'
        : '<div class="discovery-icon"><svg viewBox="0 0 24 24" aria-hidden="true">' + DEFAULT_ICON + '</svg></div>';
      var title = '<span data-i18n="' + D.addText(dict, key + 'Name', p.title) + '"></span>';
      if (p.url) title = '<a class="discovery-link" href="' + D.esc(p.url) + '" target="_blank" rel="noopener">' + title + '</a>';
      return '<div class="discovery-item' + (p.image ? ' has-image' : '') + ' reveal"' + (i ? ' data-delay="' + Math.min(i, 7) + '"' : '') + '>' +
        media +
        '<div>' +
          '<p class="discovery-name">' + title + '</p>' +
          '<p class="discovery-desc" data-i18n="' + D.addText(dict, key + 'Desc', p.summary) + '"></p>' +
          '<span class="discovery-cite">' + D.esc(p.authors) + ' — ' + D.esc(p.journal) + ' (' + D.esc(p.year) + ')</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  initSite(dict);
});
</script>
</body>
</html>
