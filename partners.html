<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partners · CODELAB — Leiden University</title>
<meta name="description" content="CODELAB's neuroscience and clinical partners across three continents, from Leiden to Yale to Tokyo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231f5ae0'/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header" id="header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html" aria-label="CODELAB, Leiden University">
      <span class="brand-name"><strong>Code</strong>Lab</span>
      <span class="brand-sub" data-i18n="brandSub">Leiden University</span>
    </a>

    <nav class="nav" id="primary-nav" aria-label="Primary">
        <a href="index.html" data-i18n="navHome">Home</a>
        <a href="discoveries.html" data-i18n="navMethods">Discoveries</a>
        <a href="questions.html" data-i18n="navQuestions">Questions</a>
        <a href="partners.html" class="is-active" data-i18n="navPartners">Partners</a>
        <a href="team.html" data-i18n="navTeam">Team</a>
        <a href="resources.html" data-i18n="navResources">Resources</a>
      </nav>

    <div class="header-controls">
      <a href="https://www.universiteitleiden.nl/en/staffmembers/arko-ghosh" class="btn btn-primary btn-sm nav-cta" data-i18n="navJoin">Join a Study</a>

      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn is-active" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="nl" type="button">NL</button>
      </div>

      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>

<!-- PARTNERS: bubbles are rendered from the PARTNERS list in the script below -->
<section class="partners-page">
  <div class="wrap">
    <h1 class="section-title partners-intro reveal" data-i18n="partnersIntro">We collaborate across disciplines.</h1>

    <div class="bubble-group">
      <h2 class="bubble-group-title reveal" data-i18n="groupCollaborators">Research partners</h2>
      <div class="bubble-cluster" id="collaborators"></div>
    </div>

    <div class="bubble-group">
      <h2 class="bubble-group-title reveal" data-i18n="groupSupporters">Supported by</h2>
      <div class="bubble-cluster" id="supporters"></div>
    </div>

    <div class="bubble-group">
      <h2 class="bubble-group-title reveal" data-i18n="groupSpinoffs">Spin-offs</h2>
      <div class="bubble-cluster" id="spinoffs"></div>
    </div>
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <span class="footer-brand"><strong>Code</strong>Lab</span>
      <span class="footer-sub" data-i18n="brandSub">Leiden University</span>
    </div>
    <p class="footer-note">© <span id="year">2026</span> <span data-i18n="footerNote">CODELAB, Leiden University. Wassenaarseweg 52, Leiden.</span></p>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/data.js"></script>
<script>
var pageText = {
  en: {
    partnersIntro: "We collaborate across disciplines.",
    groupCollaborators: "Research partners",
    groupSupporters: "Supported by",
    groupSpinoffs: "Spin-offs",
    contactPrefix: "Contact:",
    foundedPrefix: "Founded"
  },
  nl: {
    partnersIntro: "We werken samen over disciplines heen.",
    groupCollaborators: "Onderzoekspartners",
    groupSupporters: "Ondersteund door",
    groupSpinoffs: "Spin-offs",
    contactPrefix: "Contact:",
    foundedPrefix: "Opgericht"
  }
};

/* data/partners.json "group" value -> bubble cluster on this page */
var CLUSTERS = { research: 'collaborators', support: 'supporters', spinoff: 'spinoffs' };

CodeLabData.load(['partners']).then(function (data) {
  var D = CodeLabData;

  if (!data.partners) {
    D.showError(document.getElementById('collaborators'));
    ['supporters', 'spinoffs'].forEach(function (id) { document.getElementById(id).closest('.bubble-group').hidden = true; });
  } else {
    Object.keys(CLUSTERS).forEach(function (group) {
      var list = data.partners.filter(function (p) { return p.group === group; });
      var cluster = document.getElementById(CLUSTERS[group]);
      if (!list.length) { cluster.closest('.bubble-group').hidden = true; return; }
      // fewer partners -> bigger bubbles, so 2 and 20 both fill the row sensibly
      cluster.dataset.size = list.length <= 4 ? 'lg' : list.length <= 10 ? 'md' : 'sm';
      cluster.innerHTML = list.map(function (p, i) {
        var key = CLUSTERS[group] + i;
        D.addText(pageText, key + 'Name', p.name);
        /* Location, or "Founded 2024" for a spin-off without one */
        ['en', 'nl'].forEach(function (lang) {
          var loc = D.text(p.location, lang);
          pageText[lang][key + 'Place'] = loc ? D.esc(loc)
            : p.founded ? pageText[lang].foundedPrefix + ' ' + D.esc(p.founded) : '';
        });
        var contact = p.contact && p.contact.name
          ? (p.contact.url ? '<a class="bubble-contact" href="' + D.esc(p.contact.url) + '" target="_blank" rel="noopener">'
                           : '<span class="bubble-contact">') +
            '<span data-i18n="contactPrefix">Contact:</span> ' + D.esc(p.contact.name) +
            (p.contact.url ? '</a>' : '</span>')
          : '';
        return '<div class="bubble reveal" data-delay="' + Math.min(i, 7) + '">' +
          '<a class="bubble-link" href="' + D.esc(p.url) + '" target="_blank" rel="noopener">' +
            '<span class="bubble-name" data-i18n="' + key + 'Name"></span>' +
            '<span class="bubble-place" data-i18n="' + key + 'Place"></span>' +
          '</a>' + contact +
        '</div>';
      }).join('');
    });
  }

  initSite(pageText);
});
</script>
</body>
</html>
